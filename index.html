    function esc(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatRichText(rawText) {
      if (!rawText) return "";
      const escaped = esc(rawText);
      const normalizedBreaks = escaped.replace(/\\n/g, "\n");
      const lines = normalizedBreaks.split(/\r?\n/);
      return `<div class="formatted-text">${lines.map((line) => {
        const trimmed = line.trim();
        if (!trimmed) return `<div class="h-2"></div>`;
        return `<p>${trimmed}</p>`;
      }).join("")}</div>`;
    }

    function renderMathTypeset() {
      if (typeof renderMathInElement === "function") {
        renderMathInElement(document.body, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false },
            { left: "\\(", right: "\\)", display: false },
            { left: "\\[", right: "\\]", display: true }
          ],
          throwOnError: false
        });
      }
    }

    // =========================================================================
    // BỘ CÔNG CỤ SOẠN THẢO HÓA HỌC (CHỈ SỐ DƯỚI/TRÊN, MŨI TÊN t°, LỌC WORD)
    // =========================================================================
    const SUB_MAP = { "0":"₀", "1":"₁", "2":"₂", "3":"₃", "4":"₄", "5":"₅", "6":"₆", "7":"₇", "8":"₈", "9":"₉", "+":"₊", "-":"₋", "(":"₍", ")":"₎", "n":"ₙ", "x":"ₓ", "y":"ᵧ" };
    const SUP_MAP = { "0":"⁰", "1":"¹", "2":"²", "3":"³", "4":"⁴", "5":"⁵", "6":"⁶", "7":"⁷", "8":"⁸", "9":"⁹", "+":"⁺", "-":"⁻", "n":"ⁿ", "o":"°" };

    // Bôi đen chữ/số rồi bấm nút để biến thành chỉ số nhỏ (VD: H2SO4 -> bôi đen 2 -> H₂SO₄)
    function applySubscript(targetId) {
      const el = document.getElementById(targetId);
      if (!el) return;
      const start = el.selectionStart;
      const end = el.selectionEnd;
      if (start === end) {
        alert("Thầy hãy gõ số bình thường (VD: H2SO4), sau đó bôi đen số 2 hoặc số 4 rồi bấm nút [X₂] này để biến thành chữ nhỏ!");
        el.focus();
        return;
      }
      const selected = el.value.substring(start, end);
      const converted = selected.split("").map((ch) => SUB_MAP[ch] || ch).join("");
      el.value = el.value.substring(0, start) + converted + el.value.substring(end);
      el.focus();
      el.selectionStart = el.selectionEnd = start + converted.length;
      updateLivePreview(targetId);
    }

    // Bôi đen số/dấu rồi bấm nút để biến thành chỉ số trên (VD: Fe3+ -> Fe³⁺)
    function applySuperscript(targetId) {
      const el = document.getElementById(targetId);
      if (!el) return;
      const start = el.selectionStart;
      const end = el.selectionEnd;
      if (start === end) {
        alert("Thầy hãy bôi đen số hoặc dấu (+, -) cần đưa lên mũ trên rồi bấm nút [X²] này!");
        el.focus();
        return;
      }
      const selected = el.value.substring(start, end);
      const converted = selected.split("").map((ch) => SUP_MAP[ch] || ch).join("");
      el.value = el.value.substring(0, start) + converted + el.value.substring(end);
      el.focus();
      el.selectionStart = el.selectionEnd = start + converted.length;
      updateLivePreview(targetId);
    }

    // Tự động chuyển đổi nhanh công thức hóa học phổ biến trong văn bản
    function autoFormatChemInBox(targetId) {
      const el = document.getElementById(targetId);
      if (!el) return;
      let text = el.value;
      // Chuyển các chỉ số đứng sau nguyên tố hóa học (VD: H2O -> H₂O, H2SO4 -> H₂SO₄, Fe2O3 -> Fe₂O₃)
      text = text.replace(/([A-Z][a-z]?)(\d+)/g, (m, elem, digits) => {
        const subDigits = digits.split("").map((d) => SUB_MAP[d] || d).join("");
        return elem + subDigits;
      });
      // Chuyển dấu ngoặc nhóm nguyên tử (OH)2, (SO4)3 -> (OH)₂, (SO₄)₃
      text = text.replace(/\)(\d+)/g, (m, digits) => {
        const subDigits = digits.split("").map((d) => SUB_MAP[d] || d).join("");
        return ")" + subDigits;
      });
      el.value = text;
      updateLivePreview(targetId);
    }

    // Dọn sạch ký hiệu rác khi copy từ Word / Equation / MathType
    function cleanWordPaste(targetId) {
      const el = document.getElementById(targetId);
      if (!el) return;
      let s = el.value;
      // Xóa các thẻ XML / Equation rác nếu có
      s = s.replace(/<[^>]*>/g, "");
      s = s.replace(/[\u200B-\u200D\uFEFF\uFFFC]/g, "");
      // Chuẩn hóa khoảng trắng thừa và dấu mũi tên
      s = s.replace(/-->|->/g, " → ");
      s = s.replace(/<=>|<->/g, " ⇌ ");
      s = s.replace(/[ \t]{2,}/g, " ");
      el.value = s;
      updateLivePreview(targetId);
    }

    function insertSnippet(targetId, snippet) {
      const el = document.getElementById(targetId);
      if (!el) return;
      const start = el.selectionStart;
      const end = el.selectionEnd;
      const text = el.value;
      el.value = text.substring(0, start) + snippet + text.substring(end);
      el.focus();
      el.selectionStart = el.selectionEnd = start + snippet.length;
      updateLivePreview(targetId);
    }

    function updateLivePreview(targetId) {
      const el = document.getElementById(targetId);
      const previewBox = document.getElementById(targetId + "-preview");
      if (!el || !previewBox) return;
      if (!el.value.trim()) {
        previewBox.innerHTML = `<span class="text-slate-400 italic">Nội dung sau khi định dạng sẽ hiện trực tiếp tại đây...</span>`;
        return;
      }
      previewBox.innerHTML = formatRichText(el.value);
      if (typeof renderMathInElement === "function") {
        renderMathInElement(previewBox, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false }
          ],
          throwOnError: false
        });
      }
    }

          <button type="button" onclick="cleanWordPaste('${targetId}')" title="Xóa ký tự lạ khi dán từ Word"

    function normalizeText(str) {
      if (!str) return "";
      const subMap = { "₀":"0","₁":"1","₂":"2","₃":"3","₄":"4","₅":"5","₆":"6","₇":"7","₈":"8","₉":"9" };
      return String(str)
        .toLowerCase()
        .replace(/[₀-₉]/g, (m) => subMap[m] || m)
        .replace(/[_^{}\\$]/g, " ")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/đ/g, "d")
        .replace(/[^a-z0-9\s.,-]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function normalizeCode(code) {
      return String(code || "").toLowerCase().replace(/[^a-z0-9-]/g, "").trim();
    }

    function isAdmin() {
      return state.user && state.user.role === "admin";
    }

    function getAvailableChaptersForGrade(gradeId) {
      const map = new Map();
      state.chaptersList
        .filter((c) => c.grade_id === gradeId)
        .forEach((c) => {
          map.set(c.title, { id: c.id, grade_id: c.grade_id, title: c.title, theory: c.theory || "" });
        });

      state.questions
        .filter((q) => q.grade_id === gradeId)
        .forEach((q) => {
          if (q.chapter && !map.has(q.chapter)) {
            map.set(q.chapter, { id: "auto_" + q.chapter, grade_id: gradeId, title: q.chapter, theory: "" });
          }
        });

      return Array.from(map.values());
    }

    function applyUrlQueryParam() {
      const params = new URLSearchParams(window.location.search);
      const qParam = params.get("cau") || params.get("q");
      if (qParam) {
        state.mode = "lookup";
        state.searchQuery = qParam.trim();
        state.searchAllGrades = true;
        const matched = getFilteredLookupQuestions();
        if (matched.length > 0) {
          const topQ = matched[0];
          state.revealedHints[topQ.id] = true;
          state.revealedSol[topQ.id] = true;
          updateSeoMetadata(topQ);
        }
      } else {
        updateSeoMetadata(null);
      }
    }

    function updateSeoMetadata(singleQ) {
      const schemaEl = document.getElementById("qa-schema");
      if (singleQ) {
        const ansText = Array.isArray(singleQ.correct_answer) ? singleQ.correct_answer.join(" | ") : singleQ.correct_answer;
        document.title = `[${singleQ.question_code || "Hóa học"}] ${singleQ.content.replace(/\$/g, "").slice(0, 75)} - Hóa Học Thầy Chiến`;
        const metaDesc = document.querySelector('meta[name="description"]');
        if (metaDesc) metaDesc.setAttribute("content", `Đáp án: ${ansText}. ${singleQ.explanation || ""}`.replace(/\$/g, "").slice(0, 160));

        if (schemaEl) {
          schemaEl.textContent = JSON.stringify({
            "@context": "https://schema.org",
            "@type": "QAPage",
            "mainEntity": {
              "@type": "Question",
              "name": singleQ.content,
              "text": singleQ.content,
              "answerCount": 1,
              "acceptedAnswer": {
                "@type": "Answer",
                "text": `Đáp án: ${ansText}. Lời giải chi tiết: ${singleQ.explanation || ""}`
              }
            }
          });
        }
      } else {
        document.title = "Hóa Học Thầy Chiến (v4.8) - Cổng Học Liệu & Ôn Tập Chuyên Đề";
        if (schemaEl) {
          schemaEl.textContent = JSON.stringify({
            "@context": "https://schema.org",
            "@type": "FAQPage",
            "mainEntity": state.questions.slice(0, 20).map((q) => ({
              "@type": "Question",
              "name": q.content,
              "acceptedAnswer": {
                "@type": "Answer",
                "text": `${Array.isArray(q.correct_answer) ? q.correct_answer.join(" | ") : q.correct_answer} - ${q.explanation || ""}`
              }
            }))
          });
        }
      }
    }

    function copyQuestionLink(codeOrId, textQuery) {
      const url = new URL(window.location.origin + window.location.pathname);
      url.searchParams.set("cau", codeOrId || textQuery);
      navigator.clipboard.writeText(url.toString());
      alert("Đã sao chép đường dẫn công khai của câu hỏi:\n" + url.toString());
    }

    async function initApp() {
      applyUrlQueryParam();
      renderAll();

      try {
        const { data: sessData } = await db.auth.getSession();
        if (sessData && sessData.session && sessData.session.user) {
          await loadUserProfile(sessData.session.user);
        }
      } catch (e) { console.log(e); }

      try {
        const { data: gData } = await db.from("grades").select("*").eq("is_active", true);
        if (gData && gData.length > 0) state.grades = gData;

        const { data: chData } = await db.from("chapters").select("*").order("created_at", { ascending: true });
        if (chData && chData.length > 0) state.chaptersList = chData;

        const { data: qData } = await db.from("questions").select("*").order("created_at", { ascending: false });
        if (qData && qData.length > 0) state.questions = qData;

        const { data: dData } = await db.from("documents").select("*").order("created_at", { ascending: false });
        if (dData && dData.length > 0) state.docs = dData;
      } catch (e) { console.log(e); }

      applyUrlQueryParam();
      renderAll();
    }

    async function loadUserProfile(authUser) {
      const { data: profile } = await db.from("profiles").select("*").eq("id", authUser.id).single();
      if (profile) {
        state.user = {
          id: authUser.id,
          email: authUser.email,
          full_name: profile.full_name,
          role: profile.role || "student",
          class_name: profile.class_name
        };
      } else {
        state.user = {
          id: authUser.id,
          email: authUser.email,
          full_name: authUser.email.split("@")[0],
          role: "student"
        };
      }
    }

      document.getElementById("auth-modal").classList.remove("hidden");
      switchAuthTab("login");
    }

      document.getElementById("auth-modal").classList.add("hidden");
    }

    function switchAuthTab(tab) {
      state.authTab = tab;
      ["login", "register_student", "register_admin"].forEach((t) => {
        const btn = document.getElementById("tab-" + t);
        if (t === tab) {
          btn.className = t === "register_admin"
            ? "text-xs font-bold px-2.5 py-1.5 rounded bg-amber-600 text-white"
            : "text-xs font-bold px-2.5 py-1.5 rounded bg-teal-700 text-white";
        } else {
          btn.className = "text-xs font-bold px-2.5 py-1.5 rounded bg-slate-100 text-slate-700";
        }
      });

      const regFields = document.getElementById("register-fields");
      const stuExtra = document.getElementById("student-extra");
      const admExtra = document.getElementById("admin-extra");
      const submitBtn = document.getElementById("auth-submit-btn");

      if (tab === "login") {
        regFields.classList.add("hidden");
        submitBtn.textContent = "Đăng nhập hệ thống";
        submitBtn.className = "w-full bg-teal-700 hover:bg-teal-800 text-white font-bold py-2.5 rounded-lg";
      } else if (tab === "register_student") {
        regFields.classList.remove("hidden");
        stuExtra.classList.remove("hidden");
        admExtra.classList.add("hidden");
        submitBtn.textContent = "Tạo tài khoản Học sinh";
        submitBtn.className = "w-full bg-teal-700 hover:bg-teal-800 text-white font-bold py-2.5 rounded-lg";
      } else {
        regFields.classList.remove("hidden");
        stuExtra.classList.add("hidden");
        admExtra.classList.remove("hidden");
        submitBtn.textContent = "Tạo tài khoản Quản trị Giáo viên";
        submitBtn.className = "w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 rounded-lg";
      }
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById("auth-email").value.trim();
      const password = document.getElementById("auth-password").value;

      if (state.authTab === "login") {
        const { data, error } = await db.auth.signInWithPassword({ email, password });
        if (error) return alert("Đăng nhập thất bại: " + error.message);
        await loadUserProfile(data.user);
        closeAuthModal();
        renderAll();
        return;
      }

      const fullName = document.getElementById("auth-fullname").value.trim();
      if (!fullName) return alert("Vui lòng nhập họ và tên!");

      const targetRole = state.authTab === "register_admin" ? "admin" : "student";
      const codeInput = targetRole === "admin"
        ? document.getElementById("auth-admin-code").value.trim().toUpperCase()
        : document.getElementById("auth-student-code").value.trim().toUpperCase();
      const expectedCode = targetRole === "admin" ? TEACHER_ADMIN_CODE : STUDENT_CLASS_CODE;

      if (codeInput !== expectedCode) {
        return alert(targetRole === "admin" ? "Mã bí mật Giáo viên chưa đúng!" : "Mã lớp chưa đúng!");
      }

      const className = targetRole === "admin" ? "Giáo viên" : document.getElementById("auth-classname").value.trim();
      const { data, error } = await db.auth.signUp({ email, password });
      if (error) return alert("Lỗi tạo tài khoản: " + error.message);

      if (data.user) {
        await db.from("profiles").upsert({
          id: data.user.id,
          full_name: fullName,
          role: targetRole,
          grade_id: state.selectedGrade,
          class_name: className
        });
        state.user = { id: data.user.id, email, full_name: fullName, role: targetRole, class_name: className };
        if (targetRole === "admin") state.mode = "admin";
        closeAuthModal();
        renderAll();
      }
    }

    async function handleLogout() {
      await db.auth.signOut();
      state.user = null;
      if (state.mode === "admin") state.mode = "home";
      renderAll();
    }

      state.selectedGrade = id;

    function selectMode(m) {
      state.mode = m;
      if (m === "practice") {
        state.practiceGrade = state.selectedGrade;
        state.practiceSelectedChapter = "";
        state.practiceTopicSearch = "";
      }
      if (state.timerInterval) clearInterval(state.timerInterval);
      if (m === "exam" && !state.examSubmitted) {
        state.timerInterval = setInterval(() => {
          if (state.timeLeft > 0) {
            state.timeLeft--;
            const el = document.getElementById("exam-timer");
            if (el) el.textContent = formatTime(state.timeLeft);
          }
        }, 1000);
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
      renderAll();
    }

    function triggerHeroSearch(e) {
      e.preventDefault();
      const val = document.getElementById("hero-search-input").value.trim();
      state.searchQuery = val;
      state.mode = "lookup";
      const url = new URL(window.location.href);
      if (val) url.searchParams.set("cau", val);
      else url.searchParams.delete("cau");
      window.history.replaceState({}, "", url);
      renderAll();
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return m + ":" + (s < 10 ? "0" : "") + s;
    }

    function renderTopicPracticeView() {

        ? chaptersOfGrade.filter((c) => normalizeText(c.title).includes(searchNorm))
        : chaptersOfGrade;

      const selectedChObj = chaptersOfGrade.find((c) => c.title === state.practiceSelectedChapter);
      const topicQuestions = state.practiceSelectedChapter
        ? state.questions.filter((q) => q.grade_id === state.practiceGrade && q.chapter === state.practiceSelectedChapter)
        : [];

      return `
        <div class="max-w-5xl mx-auto space-y-5">
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">

              <div>
                <h2 class="font-bold text-lg text-slate-800">🎯 Cổng Ôn Tập Chuyên Đề & Bài Học</h2>
                <p class="text-xs text-slate-500">Bước 1: Chọn Khối lớp • Bước 2: Chọn Chuyên đề hoặc Bài học để mở Lý thuyết & Bài tập.</p>
              </div>
              <button onclick="goHome()" class="text-xs font-semibold text-teal-700 hover:underline">← Trang chủ</button>
            </div>

            <div class="grid sm:grid-cols-12 gap-3">
              <div class="sm:col-span-3">
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">1. Chọn Khối lớp</label>
                <select onchange="onChangePracticeGrade(this.value)"
                  class="w-full border-2 border-teal-600/30 focus:border-teal-600 rounded-xl px-3 py-2.5 text-sm font-semibold bg-white">
                  ${state.grades.map((g) => `
                    <option value="${esc(g.id)}" ${state.practiceGrade === g.id ? "selected" : ""}>${esc(g.name)}</option>
                  `).join("")}
                </select>
              </div>

              <div class="sm:col-span-5">
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">2. Chọn Chuyên đề / Bài học</label>
                <select onchange="onSelectPracticeChapter(this.value)"
                  class="w-full border-2 border-teal-600/30 focus:border-teal-600 rounded-xl px-3 py-2.5 text-sm font-semibold bg-white">
                  <option value="">-- Bấm để chọn chuyên đề / bài học --</option>

                    const count = state.questions.filter((q) => q.grade_id === state.practiceGrade && q.chapter === c.title).length;
                    return `<option value="${esc(c.title)}" ${state.practiceSelectedChapter === c.title ? "selected" : ""}>${esc(c.title)} (${count} câu)</option>`;

              </div>
            </div>
          </div>

          ${!state.practiceSelectedChapter ? `
            <div class="bg-white p-6 rounded-2xl border border-slate-200 space-y-4">
              <div class="flex items-center justify-between">
                <h3 class="font-bold text-base text-teal-900">Danh sách chuyên đề / bài học (${filteredChapters.length})</h3>

                    return `
                      <div onclick="onSelectPracticeChapter('${esc(c.title)}')"
                        class="group p-4 rounded-xl border border-slate-200 hover:border-teal-600 bg-slate-50/60 hover:bg-teal-50/40 transition cursor-pointer flex items-center justify-between gap-3">

                <div>
                  <span class="text-xs text-amber-300 font-bold uppercase">Khối ${esc(state.practiceGrade)} • Chuyên đề đang ôn tập</span>

                  <button onclick="state.practiceSectionTab = 'theory'; renderAll();"

                    }">
                    📖 Phần I: Tóm tắt Lý thuyết
                  </button>
                  <button onclick="state.practiceSectionTab = 'exercises'; renderAll();"
                    class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition ${
                      state.practiceSectionTab === "exercises" ? "bg-amber-400 text-slate-950 shadow" : "bg-teal-800 text-white hover:bg-teal-700"
                    }">
                    ✍️ Phần II: Bài tập vận dụng (${topicQuestions.length})
                  </button>
                  <button onclick="onSelectPracticeChapter('')"
                    class="px-3 py-2 rounded-xl text-xs bg-teal-950/70 text-teal-200 hover:text-white border border-teal-700">

                  </button>

              ${state.practiceSectionTab === "theory" ? `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                  <div class="flex justify-between items-center border-b pb-3">
                    <h4 class="font-bold text-base text-teal-900">📖 Kiến thức trọng tâm & Công thức cần nhớ</h4>
                    <button onclick="state.practiceSectionTab = 'exercises'; renderAll();"
                      class="text-xs font-bold bg-teal-700 text-white px-3.5 py-1.5 rounded-lg hover:bg-teal-800">
                      Chuyển sang làm Bài tập (${topicQuestions.length} câu) →
                    </button>
                  </div>
                  ${(selectedChObj && selectedChObj.theory && selectedChObj.theory.trim()) ? `
                    <div class="text-sm sm:text-base text-slate-800 leading-relaxed bg-amber-50/40 p-5 rounded-xl border border-amber-200/70">
                      ${formatRichText(selectedChObj.theory)}
                    </div>
                  ` : `
                    <div class="text-center py-8 space-y-2">
                      <p class="text-sm text-slate-500">Chuyên đề này chưa cập nhật phần tóm tắt lý thuyết.</p>
                      <button onclick="state.practiceSectionTab = 'exercises'; renderAll();" class="text-xs font-bold text-teal-700 hover:underline">
                        Làm ngay hệ thống bài tập của chuyên đề →
                      </button>
                    </div>
                  `}
                </div>
              ` : `
                <div class="space-y-4">
                  ${topicQuestions.length === 0 ? `
                    <div class="bg-white p-8 rounded-2xl border border-slate-200 text-center space-y-2">
                      <p class="text-slate-600 font-medium">Chuyên đề "${esc(state.practiceSelectedChapter)}" hiện chưa có câu hỏi bài tập nào.</p>
                      <p class="text-xs text-slate-400">Thầy Chiến có thể vào mục Quản trị Giáo viên để bổ sung câu hỏi cho chuyên đề này.</p>
                    </div>
                  ` : topicQuestions.map((q, idx) => renderSinglePracticeCard(q, idx, false)).join("")}
                </div>
              `}
            </div>
          `}
        </div>
      `;
    }

    function renderSinglePracticeCard(q, idx, isExam) {
      const showSol = (!isExam && state.checkedPractice[q.id]) || (isExam && state.examSubmitted);
      const corrStr = Array.isArray(q.correct_answer) ? q.correct_answer.join(" | ") : q.correct_answer;

      let inputHTML = "";
      if (q.type === "mcq") {
        inputHTML = `<div class="grid sm:grid-cols-2 gap-2">
          ${q.options.map((opt) => `
            <label onclick="setMcqAnswer('${esc(q.id)}', '${esc(opt)}')"
              class="flex items-center gap-2 p-3 rounded-lg border cursor-pointer ${state.answers[q.id] === opt ? "border-teal-600 bg-teal-50" : "border-slate-200"}">
              <input type="radio" name="${esc(q.id)}" ${state.answers[q.id] === opt ? "checked" : ""} />
              <span class="text-sm">${esc(opt)}</span>
            </label>
          `).join("")}
        </div>`;
      } else if (q.type === "true_false") {
        const curArr = state.answers[q.id] || ["", "", "", ""];
        inputHTML = `<div class="space-y-2">
          ${q.options.map((sub, i) => `
            <div class="flex flex-wrap items-center justify-between gap-2 p-2.5 bg-slate-50 rounded-lg border border-slate-200">
              <span class="text-sm flex-1">${esc(sub)}</span>
              <div class="flex gap-2">
                ${["Đúng", "Sai"].map((ch) => `
                  <button type="button" onclick="setTfAnswer('${esc(q.id)}', ${i}, '${ch}')"
                    class="px-3 py-1 rounded text-xs font-bold ${curArr[i] === ch ? "bg-teal-600 text-white" : "bg-white border border-slate-300 text-slate-600"}">
                    ${ch}
                  </button>
                `).join("")}
              </div>
            </div>
          `).join("")}
        </div>`;
      } else if (q.type === "fill_blank" || q.type === "short_answer") {
        inputHTML = `<input type="text" value="${esc(state.answers[q.id] || "")}"
          oninput="state.answers['${esc(q.id)}'] = this.value"
          placeholder="Nhập câu trả lời ngắn của em..."
          class="w-full sm:w-80 border border-slate-300 rounded-lg px-3 py-2 text-sm" />`;
      } else {
        inputHTML = `<textarea rows="3" oninput="state.answers['${esc(q.id)}'] = this.value"
          placeholder="Trình bày lời giải chi tiết..."
          class="w-full border border-slate-300 rounded-lg p-3 text-sm">${esc(state.answers[q.id] || "")}</textarea>`;
      }

      return `
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-3">
          <div class="flex justify-between text-xs text-slate-500">
            <div class="flex items-center gap-2">
              ${q.question_code ? `<span class="font-mono font-bold bg-slate-200 text-slate-800 px-2 py-0.5 rounded">${esc(q.question_code)}</span>` : ""}
              <span class="font-semibold text-teal-700">${esc(q.chapter)}</span>
            </div>
            <span class="uppercase bg-slate-100 px-2 py-0.5 rounded">${esc(q.type)}</span>
          </div>
          <div class="font-medium text-slate-900">
            <span class="font-bold">Câu ${idx + 1}:</span> ${formatRichText(q.content)}
          </div>
          ${inputHTML}
          ${!isExam ? `
            <div class="pt-2">
              <button onclick="state.checkedPractice['${esc(q.id)}'] = true; renderAll();"
                class="bg-teal-600 text-white text-xs font-semibold px-3.5 py-1.5 rounded-lg hover:bg-teal-700">
                Kiểm tra câu này
              </button>
            </div>
          ` : ""}
          ${showSol ? `
            <div class="bg-slate-100 p-4 rounded-lg text-sm space-y-2 border-l-4 border-teal-600">
              <p class="font-bold text-teal-800">Đáp án chuẩn: ${esc(corrStr)}</p>
              <div class="text-slate-700">${formatRichText(q.explanation)}</div>
            </div>
          ` : ""}
        </div>
      `;
    }

    function setMcqAnswer(qid, opt) {
      state.answers[qid] = opt;
      renderAll();
    }

    function setTfAnswer(qid, idx, choice) {
      if (!Array.isArray(state.answers[qid])) state.answers[qid] = ["", "", "", ""];
      state.answers[qid][idx] = choice;
      renderAll();
    }

    function calculateScore() {
      const gQuestions = state.questions.filter((q) => q.grade_id === state.selectedGrade);
      let total = 0;
      gQuestions.forEach((q) => {
        const ans = state.answers[q.id];
        if (!ans) return;
        if (q.type === "true_false" && Array.isArray(q.correct_answer)) {
          let match = 0;
          q.correct_answer.forEach((val, idx) => { if (ans[idx] === val) match++; });
          total += ([0, 0.1, 0.25, 0.5, 1.0][match] || 0);
        } else if (q.type !== "essay") {
          const u = normalizeText(String(ans)).replace(",", ".");
          const c = normalizeText(String(q.correct_answer)).replace(",", ".");
          if (u === c) total += 1;
        }
      });
      return total.toFixed(2);
    }

    function renderExamView() {
      const gQuestions = state.questions.filter((q) => q.grade_id === state.selectedGrade);

      return `
        <div class="max-w-5xl mx-auto space-y-5">
          <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-3">
            <div>
              <h2 class="font-bold text-lg text-slate-800">⏱️ Bài kiểm tra tổng hợp Khối ${esc(state.selectedGrade)}</h2>
              <p class="text-sm text-slate-500">Hỗ trợ trắc nghiệm 4 lựa chọn, Đúng/Sai 4 ý, Điền khuyết, Trả lời ngắn và Tự luận.</p>
            </div>
            <div class="flex items-center gap-3">
              <span id="exam-timer" class="bg-rose-100 text-rose-700 font-bold px-3 py-1.5 rounded-lg">⏳ ${formatTime(state.timeLeft)}</span>
              ${!state.examSubmitted ? `
                <button onclick="state.examSubmitted = true; renderAll();" class="bg-teal-700 text-white font-bold px-4 py-2 rounded-lg hover:bg-teal-800">
                  Nộp bài
                </button>
              ` : ""}
              <button onclick="goHome()" class="text-xs font-semibold text-teal-700 hover:underline">← Trang chủ</button>
            </div>
          </div>

          ${state.examSubmitted ? `
            <div class="bg-emerald-50 border border-emerald-300 p-5 rounded-xl flex justify-between items-center">
              <div>
                <h3 class="font-bold text-emerald-900 text-lg">🎉 Đã nộp bài thành công!</h3>
                <p class="text-sm text-emerald-800">Điểm phần tự động chấm: <strong class="text-xl">${calculateScore()}</strong> điểm.</p>
              </div>
              <button onclick="state.examSubmitted = false; state.answers = {}; state.timeLeft = 900; renderAll();"
                class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">
                Làm lại đề
              </button>
            </div>
          ` : ""}

          ${gQuestions.map((q, idx) => renderSinglePracticeCard(q, idx, true)).join("")}
        </div>
      `;
    }

    function updateSearch(val) {
      state.searchQuery = val;
      const url = new URL(window.location.href);
      if (val.trim()) url.searchParams.set("cau", val.trim());
      else url.searchParams.delete("cau");
      window.history.replaceState({}, "", url);
      renderLookupResultsOnly();
    }

    function setQuickCode(code) {
      state.searchQuery = code;
      state.mode = "lookup";
      const url = new URL(window.location.href);
      url.searchParams.set("cau", code);
      window.history.replaceState({}, "", url);
      renderAll();
    }

    function toggleHint(id) {
      state.revealedHints[id] = !state.revealedHints[id];
      renderLookupResultsOnly();
    }

    function toggleSol(id) {
      state.revealedSol[id] = !state.revealedSol[id];
      renderLookupResultsOnly();
    }

    function getFilteredLookupQuestions() {
      const rawTrim = state.searchQuery.trim();
      const normCodeQuery = normalizeCode(rawTrim);
      const normTextQuery = normalizeText(rawTrim);

      const pool = (rawTrim && state.searchAllGrades)
        ? state.questions
        : state.questions.filter((q) => q.grade_id === state.selectedGrade);

      return pool
        .filter((q) => state.chapterFilter === "ALL" || q.chapter === state.chapterFilter)
        .map((q) => {
          if (!rawTrim) return { ...q, matchType: "default", priority: 0 };
          const qCode = normalizeCode(q.question_code);

          if (qCode && qCode === normCodeQuery) return { ...q, matchType: "exact_code", priority: 100 };
          if (qCode && normCodeQuery.length >= 2 && qCode.includes(normCodeQuery)) return { ...q, matchType: "partial_code", priority: 80 };

          const tokens = normTextQuery.split(" ").filter(Boolean);
          if (tokens.length === 0) return { ...q, matchType: "none", priority: -1 };

          const haystack = normalizeText(
            (q.question_code || "") + " " + q.chapter + " " + q.content + " " + (q.options || []).join(" ")
          );
          let matched = 0;
          tokens.forEach((t) => { if (haystack.includes(t)) matched++; });

          const ratio = matched / tokens.length;
          if (ratio >= 0.5) {
            return { ...q, matchType: "keyword", matchPercent: Math.round(ratio * 100), priority: Math.round(ratio * 60) };
          }
          return { ...q, matchType: "none", priority: -1 };
        })
        .filter((q) => q.priority >= 0)
        .sort((a, b) => b.priority - a.priority);
    }

    function renderLookupResultsHTML() {
      const results = getFilteredLookupQuestions();
      if (results.length === 0) {
        return `
          <div class="bg-white p-8 rounded-xl border border-slate-200 text-center space-y-2">
            <p class="text-slate-600 font-medium">Không tìm thấy câu hỏi nào khớp với "${esc(state.searchQuery)}".</p>
            <p class="text-xs text-slate-400">Em hãy kiểm tra lại Mã câu hỏi in ở đầu đề bài (VD: 9KL-01) hoặc nhập 2-3 từ khóa ngắn gọn nhé.</p>
          </div>
        `;
      }

      return results.map((q, idx) => {
        const showH = !!state.revealedHints[q.id];
        const showS = !!state.revealedSol[q.id];
        const corrStr = Array.isArray(q.correct_answer) ? q.correct_answer.join(" | ") : q.correct_answer;

        return `
          <article class="bg-white p-5 rounded-xl shadow-sm border space-y-3 ${
            q.matchType === "exact_code" ? "border-2 border-teal-600 ring-2 ring-teal-100" : "border-slate-200"
          }">
            <div class="flex flex-wrap justify-between items-center gap-2 text-xs">
              <div class="flex items-center gap-2 flex-wrap">
                ${q.question_code ? `<span class="bg-teal-700 text-white font-mono font-bold px-2.5 py-1 rounded">Mã: ${esc(q.question_code)}</span>` : ""}
                <span class="bg-slate-100 text-slate-700 font-semibold px-2.5 py-1 rounded">Khối ${esc(q.grade_id)} • ${esc(q.chapter)}</span>
                ${q.matchType === "exact_code" ? `<span class="bg-emerald-100 text-emerald-800 font-bold px-2.5 py-1 rounded">✓ Khớp chính xác Mã câu hỏi</span>` : ""}
                ${q.matchType === "keyword" ? `<span class="bg-sky-50 text-sky-700 font-medium px-2 py-0.5 rounded">Khớp ${q.matchPercent}% từ khóa</span>` : ""}
              </div>
              <button onclick="copyQuestionLink('${esc(q.question_code || "")}', '${esc(q.content.replace(/\$/g, "").slice(0, 40))}')"
                class="text-teal-700 hover:underline font-medium">
                🔗 Lấy link câu này
              </button>
            </div>

            <div class="font-medium text-slate-900 leading-relaxed text-base">
              <span class="font-bold text-teal-800">${q.question_code ? "[" + esc(q.question_code) + "] " : "Câu " + (idx + 1) + ": "}</span>
              ${formatRichText(q.content)}
            </div>

            ${(q.options && q.options.length > 0) ? `
              <ul class="grid sm:grid-cols-2 gap-2 text-sm text-slate-700 pl-2">
                ${q.options.map((o) => `<li>• ${esc(o)}</li>`).join("")}
              </ul>
            ` : ""}

            <div class="flex flex-wrap gap-2 pt-2">
              <button onclick="toggleHint('${esc(q.id)}')" class="px-3.5 py-1.5 text-sm bg-amber-100 text-amber-900 font-semibold rounded-lg hover:bg-amber-200">
                💡 ${showH ? "Ẩn gợi ý" : "Gợi ý phương pháp giải"}
              </button>
              <button onclick="toggleSol('${esc(q.id)}')" class="px-3.5 py-1.5 text-sm bg-teal-100 text-teal-900 font-semibold rounded-lg hover:bg-teal-200">
                📖 ${showS ? "Ẩn đáp án" : "Xem đáp án & lời giải chi tiết"}
              </button>
            </div>

            ${showH ? `
              <div class="bg-amber-50 border-l-4 border-amber-400 p-4 text-sm text-amber-950 space-y-2 rounded-r-lg">
                <p class="font-bold text-amber-800">Hướng dẫn tư duy từng bước:</p>
                ${(q.hints && q.hints.length > 0)
                  ? q.hints.map((h) => formatRichText(h)).join("")
                  : `<p>Đọc kỹ dữ kiện đề bài, viết phương trình hóa học và tính số mol các chất đã biết.</p>`}
              </div>
            ` : ""}

            ${showS ? `
              <div class="bg-teal-50 border-l-4 border-teal-600 p-4 text-sm text-teal-950 space-y-2.5 rounded-r-lg">
                <p class="font-bold text-teal-900 text-base border-b border-teal-200 pb-1.5">
                  Đáp án chuẩn: ${esc(corrStr)}
                </p>
                <div class="leading-relaxed text-slate-800">
                  ${formatRichText(q.explanation)}
                </div>
              </div>
            ` : ""}
          </article>
        `;
      }).join("");
    }

    function renderLookupResultsOnly() {
      const box = document.getElementById("lookup-results-box");
      if (box) {
        box.innerHTML = renderLookupResultsHTML();
        renderMathTypeset();
      }
    }

    function renderLookupView() {
      const sourceList = (state.searchAllGrades && state.searchQuery.trim())
        ? state.questions
        : state.questions.filter((q) => q.grade_id === state.selectedGrade);
      const chapters = ["ALL", ...Array.from(new Set(sourceList.map((q) => q.chapter)))];

    async function addNewDoc(e) {
      e.preventDefault();
      if (!isAdmin()) return;
      const payload = {
        grade_id: document.getElementById("doc-grade").value,
        category: document.getElementById("doc-cat").value.trim(),
        title: document.getElementById("doc-title").value.trim(),
        summary: document.getElementById("doc-summary").value.trim(),
        link: document.getElementById("doc-link").value.trim()
      };
      const { data, error } = await db.from("documents").insert(payload).select();
      if (error) return alert("Lỗi lưu tài liệu lên Supabase: " + error.message);
      if (data) {
        state.docs.unshift(data[0]);
        alert("Đã lưu vĩnh viễn tài liệu lên hệ thống!");
        renderAll();
      }
    }

    async function deleteDoc(id) {
      if (!isAdmin() || !confirm("Thầy chắc chắn muốn xóa tài liệu này?")) return;
      await db.from("documents").delete().eq("id", id);
      state.docs = state.docs.filter((d) => d.id !== id);
      renderAll();
    }

    function autoExtractCode(textarea) {
      const val = textarea.value;
      const match = val.trim().match(/^\[([A-Za-z0-9-_]+)\]\s*(.*)$/s);
      const codeInput = document.getElementById("q-code");
      if (match && codeInput && !codeInput.value.trim()) {
        codeInput.value = match[1].toUpperCase();
        textarea.value = match[2].trim();
      }
      updateLivePreview("q-content");
    }

    function syncAdminChapterOptions(gradeSelectId, chapterSelectId) {
      const gId = document.getElementById(gradeSelectId)?.value || "9";
      const chSelect = document.getElementById(chapterSelectId);
      if (!chSelect) return;
      const list = getAvailableChaptersForGrade(gId);
      chSelect.innerHTML = list.map((c) => `<option value="${esc(c.title)}">${esc(c.title)}</option>`).join("")
        + `<option value="__NEW__">+ Nhập tên chuyên đề khác...</option>`;
    }

    function handleChapterSelectChange(selectEl, customInputId) {
      const customInp = document.getElementById(customInputId);
      if (!customInp) return;
      if (selectEl.value === "__NEW__") {
        customInp.classList.remove("hidden");
        customInp.required = true;
        customInp.focus();
      } else {
        customInp.classList.add("hidden");
        customInp.required = false;
      }
    }

    async function submitAddChapter(e) {
      e.preventDefault();
      if (!isAdmin()) return;
      const gradeId = document.getElementById("ch-grade").value;
      const title = document.getElementById("ch-title").value.trim();
      const theory = document.getElementById("ch-theory").value.trim();

      const payload = { grade_id: gradeId, title, theory };
      const { data, error } = await db.from("chapters").insert(payload).select();
      if (error) {
        alert("Lỗi lưu chuyên đề lên Supabase: " + error.message);
      } else if (data) {
        state.chaptersList.push(data[0]);
        alert(`Đã lưu vĩnh viễn chuyên đề "${title}" lên hệ thống!`);
        renderAll();
      }
    }

    async function deleteChapterItem(id, title) {
      if (!isAdmin() || !confirm(`Xóa chuyên đề "${title}" khỏi danh mục?`)) return;
      if (!String(id).startsWith("ch_") && !String(id).startsWith("auto_")) {
        await db.from("chapters").delete().eq("id", id);
      }
      state.chaptersList = state.chaptersList.filter((c) => c.id !== id);
      renderAll();
    }

    async function submitSingleQuestion(e) {
      e.preventDefault();
      if (!isAdmin()) return;

      const code = document.getElementById("q-code").value.trim().toUpperCase();
      const gradeId = document.getElementById("q-grade").value;
      const chSelectVal = document.getElementById("q-chapter-select").value;
      const chapter = chSelectVal === "__NEW__"
        ? document.getElementById("q-chapter-custom").value.trim()
        : chSelectVal;

      const type = document.getElementById("q-type").value;
      const content = document.getElementById("q-content").value.trim();
      const ansRaw = document.getElementById("q-answer").value.trim();
      const hint1 = document.getElementById("q-hint1").value.trim();
      const hint2 = document.getElementById("q-hint2").value.trim();
      const explanation = document.getElementById("q-exp").value.trim();

      const opts = [
        document.getElementById("q-optA")?.value.trim(),
        document.getElementById("q-optB")?.value.trim(),
        document.getElementById("q-optC")?.value.trim(),
        document.getElementById("q-optD")?.value.trim()
      ].filter(Boolean);

      const corr = type === "true_false" ? ansRaw.split(",").map((s) => s.trim()) : ansRaw;
      const hints = [hint1, hint2].filter(Boolean);

      const payload = {
        question_code: code,
        grade_id: gradeId,
        chapter: chapter,
        type: type,
        content: content,
        options: opts,
        correct_answer: corr,
        hints: hints,
        explanation: explanation,
        search_index: normalizeText(code + " " + chapter + " " + content + " " + opts.join(" "))
      };

      const { data, error } = await db.from("questions").insert(payload).select();
      if (error) {
        alert("Lỗi lưu lên Supabase: " + error.message);
      } else if (data) {
        state.questions.unshift(data[0]);
        alert("Đã lưu thành công câu hỏi có Mã: [" + code + "] vào chuyên đề \"" + chapter + "\"!");
        renderAll();
      }
    }

    async function submitBulkImport(e) {
      e.preventDefault();
      if (!isAdmin()) return;

      const gradeId = document.getElementById("bulk-grade").value;
      const chSelectVal = document.getElementById("bulk-chapter-select").value;
      const chapter = chSelectVal === "__NEW__"
        ? document.getElementById("bulk-chapter-custom").value.trim()
        : chSelectVal;
      const lines = document.getElementById("bulk-text").value.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);

      const rows = [];
      for (const line of lines) {
        const parts = line.split("|").map((p) => p.trim());
        if (parts.length < 3) continue;
        const code = parts[0].toUpperCase();
        rows.push({
          question_code: code,
          grade_id: gradeId,
          chapter: chapter,
          type: "short_answer",
          content: parts[1],
          options: [],
          correct_answer: parts[2],
          hints: parts[3] ? [parts[3]] : [],
          explanation: parts[4] || ("Đáp án chuẩn: " + parts[2]),
          search_index: normalizeText(code + " " + chapter + " " + parts[1])
        });
      }

      if (rows.length === 0) return alert("Mỗi dòng cần đúng dạng: MÃ | ĐỀ BÀI | ĐÁP ÁN");

      const { data, error } = await db.from("questions").insert(rows).select();
      if (error) return alert("Lỗi nhập hàng loạt: " + error.message);
      if (data) {
        state.questions = [...data, ...state.questions];
        alert("Đã nạp thành công " + data.length + " câu hỏi!");
        renderAll();
      }
    }

    async function submitAddGrade(e) {
      e.preventDefault();

      const id = document.getElementById("new-grade-id").value.trim();
      const name = document.getElementById("new-grade-name").value.trim();

      state.grades.push(payload);
      alert("Đã mở thêm khối lớp mới!");
      renderAll();
    }

                </div>

                <div>
                  <label class="block text-xs font-semibold mb-1">Lời giải chi tiết (Nhấn Enter để xuống dòng từng bước)</label>
                  ${renderChemToolbar("q-exp")}
                  <textarea id="q-exp" rows="5" oninput="updateLivePreview('q-exp')"
                    placeholder="Bước 1: Tính số mol...\nBước 2: Phương trình hóa học..."
                    class="w-full border border-slate-300 rounded-b-lg p-2.5 text-sm"></textarea>
                  <div class="mt-1.5 p-3 bg-teal-50/60 border border-teal-200 rounded-lg text-sm">
                    <div class="text-[10px] font-bold text-teal-800 uppercase mb-1">👁️ Xem trước lời giải chi tiết:</div>
                    <div id="q-exp-preview"><span class="text-slate-400 italic">Lời giải chi tiết sẽ hiện trực tiếp tại đây...</span></div>
                  </div>
                </div>

                <button type="submit" class="bg-teal-700 text-white font-bold px-5 py-2.5 rounded-lg hover:bg-teal-800 shadow-sm">
                  + Lưu câu hỏi & Mã tra cứu lên hệ thống
                </button>
              </form>
            </div>
          ` : ""}

          ${state.adminSubTab === "bulk" ? `
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
              <div>
                <h2 class="font-bold text-lg text-teal-800">Nhập nhanh hàng loạt câu hỏi có sẵn Mã</h2>
                <p class="text-xs text-slate-600 mt-1">
                  Mỗi dòng 1 câu: <code class="bg-slate-100 px-1 rounded font-bold">MÃ | ĐỀ BÀI | ĐÁP ÁN | GỢI Ý | LỜI GIẢI</code> (Dùng <code class="bg-slate-100 px-1 rounded">\\n</code> để xuống dòng).
                </p>
              </div>
              <form onsubmit="submitBulkImport(event)" class="space-y-3">
                <div class="grid sm:grid-cols-2 gap-3">
                  <div>
                    <label class="block text-xs font-semibold mb-1">Khối lớp</label>
                    <select id="bulk-grade" onchange="syncAdminChapterOptions('bulk-grade', 'bulk-chapter-select')" class="w-full border rounded-lg p-2 text-sm">
                      ${state.grades.map((g) => `<option value="${esc(g.id)}">${esc(g.name)}</option>`).join("")}
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-semibold mb-1">Chuyên đề / Bài học</label>
                    <select id="bulk-chapter-select" onchange="handleChapterSelectChange(this, 'bulk-chapter-custom')" class="w-full border rounded-lg p-2 text-sm bg-white">
                      ${defaultChapters.map((c) => `<option value="${esc(c.title)}">${esc(c.title)}</option>`).join("")}
                      <option value="__NEW__">+ Nhập tên chuyên đề khác...</option>
                    </select>
                    <input id="bulk-chapter-custom" placeholder="Nhập tên chuyên đề mới..." class="hidden mt-1.5 w-full border border-teal-500 rounded-lg p-2 text-sm bg-white" />
                  </div>
                </div>
                <textarea id="bulk-text" required rows="6"
                  placeholder="9KL-10 | Hòa tan 2,4g Mg vào HCl dư thu được bao nhiêu lít H₂ (đkc)? | 2,479 lít | Tính n(Mg) = 0,1 mol | Bước 1: n(Mg) = 0,1 mol\\nBước 2: V(H₂) = 0,1 × 24,79 = 2,479 lít"
                  class="w-full border rounded-lg p-3 text-sm font-mono"></textarea>
                <button type="submit" class="bg-teal-700 text-white font-bold px-5 py-2.5 rounded-lg hover:bg-teal-800">
                  ⚡ Nạp toàn bộ danh sách lên hệ thống
                </button>
              </form>
            </div>
          ` : ""}

          ${state.adminSubTab === "docs" ? `
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
              <h2 class="font-bold text-lg text-teal-800">Đăng Tài liệu / Chuyên đề mới lên Kho Tài liệu</h2>
              <form onsubmit="addNewDoc(event)" class="space-y-3">
                <div class="grid sm:grid-cols-2 gap-3">
                  <div>
                    <label class="block text-xs font-semibold mb-1">Áp dụng cho Khối lớp</label>
                    <select id="doc-grade" class="w-full border rounded-lg p-2 text-sm">
                      ${state.grades.map((g) => `<option value="${esc(g.id)}">${esc(g.name)}</option>`).join("")}
                      <option value="ALL">Dùng chung tất cả các khối</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-semibold mb-1">Phân loại tài liệu</label>
                    <input id="doc-cat" required placeholder="VD: Tóm tắt lý thuyết, Đề cương ôn tập, Sơ đồ tư duy..." class="w-full border rounded-lg p-2 text-sm" />
                  </div>
                </div>
                <div>
                  <label class="block text-xs font-semibold mb-1">Tiêu đề tài liệu</label>
                  <input id="doc-title" required placeholder="VD: Chuyên đề Kim loại & Dãy hoạt động hóa học (KHTN 9)" class="w-full border rounded-lg p-2 text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-semibold mb-1">Nội dung tóm tắt / Kiến thức trọng tâm</label>
                  ${renderChemToolbar("doc-summary")}
                  <textarea id="doc-summary" required rows="3" oninput="updateLivePreview('doc-summary')" placeholder="Tóm tắt nội dung chính hoặc công thức quan trọng..." class="w-full border border-slate-300 rounded-b-lg p-2.5 text-sm"></textarea>
                </div>
                <div>
                  <label class="block text-xs font-semibold mb-1">Đường link tải tệp (Google Drive / PDF - Tùy chọn)</label>
                  <input id="doc-link" placeholder="https://drive.google.com/..." class="w-full border rounded-lg p-2 text-sm" />
                </div>
                <button type="submit" class="bg-teal-700 text-white font-bold px-5 py-2.5 rounded-lg hover:bg-teal-800">
                  + Đăng lên Kho Tài liệu
                </button>
              </form>
            </div>
          ` : ""}

          ${state.adminSubTab === "grades" ? `
            <div class="bg-white p-5 rounded-xl shadow-sm border border-amber-200">
              <h2 class="font-bold text-base text-amber-900 mb-3">Quản lý & Mở rộng Khối lớp</h2>
              <form onsubmit="submitAddGrade(event)" class="flex flex-wrap gap-3">
                <input id="new-grade-id" required placeholder="Mã khối (VD: 8, 11, ONTHI)" class="border rounded-lg px-3 py-2 text-sm" />
                <input id="new-grade-name" required placeholder="Tên hiển thị (VD: Khối 8, Ôn thi vào 10)" class="border rounded-lg px-3 py-2 text-sm flex-1" />
                <button type="submit" class="bg-amber-600 text-white font-semibold px-4 py-2 rounded-lg text-sm hover:bg-amber-700">
                  + Thêm khối lớp
                </button>
              </form>
            </div>
          ` : ""}

          <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-3">
            <h2 class="font-bold text-lg text-slate-800">Danh sách câu hỏi & Mã đã lưu (${state.questions.length} câu)</h2>
            ${state.questions.map((q) => `
              <div class="flex justify-between items-start gap-3 p-3 border rounded-lg text-sm">
                <div>
                  <span class="font-mono font-bold bg-teal-700 text-white px-2 py-0.5 rounded mr-2">
                    ${esc(q.question_code || "CHƯA CÓ MÃ")}
                  </span>
                  <span class="text-xs font-bold text-slate-500">[Khối ${esc(q.grade_id)} - ${esc(q.chapter)}] </span>
                  <span>${esc(q.content)}</span>
                </div>
                <button onclick="deleteQuestion('${esc(q.id)}')" class="text-xs text-rose-600 hover:underline font-semibold shrink-0">Xóa</button>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    initApp();
  </script>
</body>
</html>
