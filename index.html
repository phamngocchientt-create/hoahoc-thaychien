  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    // =========================================================================
    // KẾT NỐI SUPABASE DỰ ÁN "HOÁ HỌC - THẦY CHIẾN"
    // =========================================================================
    const SUPABASE_URL = "https://tfmexicqxbuznmvtepzq.supabase.co";
    const SUPABASE_KEY = "sb_publishable_gC4WzQW2X2bhuAX4QpPzcg_EBHDDGMg";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const STUDENT_CLASS_CODE = "THAYCHIEN";
    const TEACHER_ADMIN_CODE = "ADMIN_THAYCHIEN";

    const { useState, useEffect, useMemo } = React;

    // =========================================================================
    // BỘ CHUẨN HÓA VĂN BẢN & CÔNG THỨC HÓA HỌC
    // =========================================================================
    function normalizeText(str) {
      if (!str) return "";
      const subMap = {
        "₀": "0", "₁": "1", "₂": "2", "₃": "3", "₄": "4",
        "₅": "5", "₆": "6", "₇": "7", "₈": "8", "₉": "9"
      };
      return String(str)
        .toLowerCase()
        .replace(/[₀-₉]/g, (m) => subMap[m] || m)
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "")
        .replace(/đ/g, "d")
        .replace(/[^a-z0-9\s.,-]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function normalizeCode(code) {
      if (!code) return "";
      return String(code).toLowerCase().replace(/\s+/g, "").trim();
    }

    // Dữ liệu mẫu có sẵn Mã câu hỏi chuẩn GDPT 2018 (Danh pháp IUPAC)
    const SAMPLE_QUESTIONS = [
      {
        id: "q1",
        question_code: "9KL-01",
        grade_id: "9",
        chapter: "Kim loại & Phi kim",
        type: "mcq",
        content: "Kim loại nào sau đây tác dụng được với dung dịch sulfuric acid (H₂SO₄) loãng giải phóng khí hydrogen?",
        options: ["Copper (Cu)", "Iron (Fe)", "Silver (Ag)", "Gold (Au)"],
        correct_answer: "Iron (Fe)",
        hints: [
          "Bước 1: Nhớ lại dãy hoạt động hóa học của kim loại.",
          "Bước 2: Chỉ các kim loại đứng trước Hydrogen (H) mới phản ứng được với dung dịch acid loãng."
        ],
        explanation: "Iron (Fe) đứng trước H trong dãy hoạt động hóa học nên phản ứng được: Fe + H₂SO₄ → FeSO₄ + H₂↑. Các kim loại Cu, Ag, Au đứng sau H nên không phản ứng.",
        search_count: 14
      },
      {
        id: "q2",
        question_code: "9HC-02",
        grade_id: "9",
        chapter: "Hợp chất hữu cơ - Hydrocarbon",
        type: "true_false",
        content: "Cho các phát biểu sau về alkane và alkene. Chọn Đúng hoặc Sai cho mỗi ý:",
        options: [
          "a) Methane (CH₄) là thành phần chính của khí thiên nhiên và khí mỏ dầu.",
          "b) Ethylene (C₂H₄) làm mất màu dung dịch bromine ở điều kiện thường.",
          "c) Đốt cháy hoàn toàn alkane luôn thu được số mol CO₂ lớn hơn số mol H₂O.",
          "d) Phản ứng đặc trưng của methane với chlorine ngoài ánh sáng là phản ứng cộng."
        ],
        correct_answer: ["Đúng", "Đúng", "Sai", "Sai"],
        hints: [
          "Bước 1: Xem lại tính chất vật lí và nguồn tự nhiên của methane.",
          "Bước 2: So sánh liên kết đơn (phản ứng thế) ở alkane và liên kết đôi (phản ứng cộng) ở alkene."
        ],
        explanation: "a) Đúng. b) Đúng do C₂H₄ có liên kết đôi kém bền. c) Sai vì đốt alkane thu được n(H₂O) > n(CO₂). d) Sai vì methane tham gia phản ứng thế.",
        search_count: 21
      },
      {
        id: "q3",
        question_code: "10NT-01",
        grade_id: "10",
        chapter: "Cấu tạo nguyên tử",
        type: "short_answer",
        content: "Nguyên tử Aluminium (Al) có số hiệu nguyên tử Z = 13 và số khối A = 27. Tổng số hạt proton, neutron và electron trong một nguyên tử Al là bao nhiêu?",
        options: [],
        correct_answer: "40",
        hints: [
          "Bước 1: Trong nguyên tử trung hòa điện: số p = số e = Z.",
          "Bước 2: Số khối A = Z + N ⇒ N = A - Z."
        ],
        explanation: "Ta có p = e = 13; n = 27 - 13 = 14. Tổng số hạt cơ bản = 13 + 13 + 14 = 40 hạt.",
        search_count: 9
      },
      {
        id: "q4",
        question_code: "10LK-01",
        grade_id: "10",
        chapter: "Liên kết hóa học",
        type: "fill_blank",
        content: "Liên kết được hình thành bởi lực hút tĩnh điện giữa các ion mang điện tích trái dấu được gọi là liên kết ______.",
        options: [],
        correct_answer: "ion",
        hints: ["Gợi ý: Tên loại liên kết trùng với tên của các hạt mang điện tạo nên nó."],
        explanation: "Liên kết ion được hình thành bởi lực hút tĩnh điện giữa cation và anion.",
        search_count: 7
      },
      {
        id: "q5",
        question_code: "9KL-05",
        grade_id: "9",
        chapter: "Kim loại & Phi kim",
        type: "essay",
        content: "Hòa tan hoàn toàn 5,6 gam Iron (Fe) vào dung dịch hydrochloric acid (HCl) dư. Viết phương trình hóa học và tính thể tích khí hydrogen thoát ra ở điều kiện chuẩn (25 °C, 1 bar).",
        options: [],
        correct_answer: "V = 2,479 L",
        hints: [
          "Bước 1: Tính số mol Fe theo công thức n = m / M (M_Fe = 56).",
          "Bước 2: Ở điều kiện chuẩn (25 °C, 1 bar), thể tích mol khí V_m = 24,79 L/mol."
        ],
        explanation: "n(Fe) = 5,6 / 56 = 0,1 mol. PTHH: Fe + 2HCl → FeCl₂ + H₂↑. Theo PTHH: n(H₂) = 0,1 mol ⇒ V(H₂) = 0,1 × 24,79 = 2,479 lít.",
        search_count: 18
      }
    ];

    function App() {
      const [user, setUser] = useState(null);
      const [authModal, setAuthModal] = useState(false);
      const [authTab, setAuthTab] = useState("login");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [fullName, setFullName] = useState("");
      const [className, setClassName] = useState("9D");
      const [secretCode, setSecretCode] = useState("");

      const [grades, setGrades] = useState([
        { id: "9", name: "Khối 9", description: "KHTN 9 - Phân môn Hóa học (KNTT)" },
        { id: "10", name: "Khối 10", description: "Hóa học 10 (KNTT)" }
      ]);
      const [selectedGrade, setSelectedGrade] = useState("9");
      const [mode, setMode] = useState("lookup");
      const [questions, setQuestions] = useState(SAMPLE_QUESTIONS);

      // State Tra cứu kết hợp Mã câu hỏi & Từ khóa
      const [searchQuery, setSearchQuery] = useState("");
      const [chapterFilter, setChapterFilter] = useState("ALL");
      const [searchAllGrades, setSearchAllGrades] = useState(true); // Mặc định tìm theo mã trên toàn hệ thống
      const [revealedHints, setRevealedHints] = useState({});
      const [revealedSol, setRevealedSol] = useState({});

      // State Luyện tập & Kiểm tra
      const [answers, setAnswers] = useState({});
      const [checkedPractice, setCheckedPractice] = useState({});
      const [examSubmitted, setExamSubmitted] = useState(false);
      const [timeLeft, setTimeLeft] = useState(900);

      // State Admin
      const [newGradeName, setNewGradeName] = useState("");
      const [newGradeId, setNewGradeId] = useState("");
      const [newQ, setNewQ] = useState({
        question_code: "",
        grade_id: "9",
        chapter: "Kim loại & Phi kim",
        type: "mcq",
        content: "",
        optA: "", optB: "", optC: "", optD: "",
        correct_answer: "",
        hint1: "",
        hint2: "",
        explanation: ""
      });

      const isAdmin = user?.role === "admin";

      useEffect(() => {
        checkSession();
        loadFromSupabase();
      }, []);

      useEffect(() => {
        if (mode !== "exam" || examSubmitted) return;
        const timer = setInterval(() => {
          setTimeLeft((prev) => (prev > 0 ? prev - 1 : 0));
        }, 1000);
        return () => clearInterval(timer);
      }, [mode, examSubmitted]);

      async function checkSession() {
        const { data } = await supabase.auth.getSession();
        if (data?.session?.user) {
          await fetchUserProfile(data.session.user);
        }
      }

      async function fetchUserProfile(authUser) {
        const { data: profile } = await supabase
          .from("profiles")
          .select("*")
          .eq("id", authUser.id)
          .single();

        if (profile) {
          setUser({
            id: authUser.id,
            email: authUser.email,
            full_name: profile.full_name,
            role: profile.role || "student",
            class_name: profile.class_name
          });
        } else {
          setUser({
            id: authUser.id,
            email: authUser.email,
            full_name: authUser.email.split("@")[0],
            role: "student"
          });
        }
      }

      async function loadFromSupabase() {
        try {
          const { data: gData } = await supabase.from("grades").select("*").eq("is_active", true);
          if (gData && gData.length > 0) setGrades(gData);

          const { data: qData } = await supabase.from("questions").select("*").order("created_at", { ascending: false });
          if (qData && qData.length > 0) setQuestions(qData);
        } catch (err) {
          console.log("Đang dùng dữ liệu mẫu:", err.message);
        }
      }

      async function handleAuth(e) {
        e.preventDefault();
        if (authTab === "login") {
          const { data, error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) return alert("Đăng nhập thất bại: " + error.message);
          await fetchUserProfile(data.user);
          setAuthModal(false);
          return;
        }

        const targetRole = authTab === "register_admin" ? "admin" : "student";
        const expectedCode = targetRole === "admin" ? TEACHER_ADMIN_CODE : STUDENT_CLASS_CODE;

        if (secretCode.trim().toUpperCase() !== expectedCode) {
          alert(
            targetRole === "admin"
              ? "Mã xác thực Giáo viên không chính xác!"
              : "Mã lớp học sinh chưa đúng! Vui lòng nhập mã do Thầy Chiến cung cấp."
          );
          return;
        }

        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) return alert("Lỗi tạo tài khoản: " + error.message);

        if (data.user) {
          await supabase.from("profiles").upsert({
            id: data.user.id,
            full_name: fullName,
            role: targetRole,
            grade_id: selectedGrade,
            class_name: targetRole === "admin" ? "Giáo viên" : className
          });
          setUser({
            id: data.user.id,
            email,
            full_name: fullName,
            role: targetRole,
            class_name: targetRole === "admin" ? "Giáo viên" : className
          });
          if (targetRole === "admin") setMode("admin");
          setAuthModal(false);
        }
      }

      async function handleLogout() {
        await supabase.auth.signOut();
        setUser(null);
        if (mode === "admin") setMode("lookup");
      }

      async function handleAddGrade(e) {
        e.preventDefault();
        if (!isAdmin) return;
        const payload = { id: newGradeId.trim(), name: newGradeName.trim(), description: "Chương trình Hóa học", is_active: true };
        const { error } = await supabase.from("grades").insert(payload);
        if (error) return alert("Lỗi thêm khối: " + error.message);
        setGrades([...grades, payload]);
        setNewGradeId("");
        setNewGradeName("");
        alert("Đã mở thêm khối lớp mới!");
      }

      async function handleAddQuestion(e) {
        e.preventDefault();
        if (!isAdmin) return alert("Chỉ tài khoản Giáo viên mới có quyền thêm câu hỏi!");

        const opts = newQ.type === "mcq" || newQ.type === "true_false"
          ? [newQ.optA, newQ.optB, newQ.optC, newQ.optD].filter(Boolean)
          : [];
        const corr = newQ.type === "true_false"
          ? newQ.correct_answer.split(",").map((s) => s.trim())
          : newQ.correct_answer;

        const hintsArr = [newQ.hint1, newQ.hint2].filter((h) => h && h.trim() !== "");
        const cleanCode = newQ.question_code.trim().toUpperCase();

        const payload = {
          question_code: cleanCode || null,
          grade_id: newQ.grade_id,
          chapter: newQ.chapter,
          type: newQ.type,
          content: newQ.content,
          options: opts,
          correct_answer: corr,
          hints: hintsArr,
          explanation: newQ.explanation,
          search_index: normalizeText(`${cleanCode} ${newQ.chapter} ${newQ.content} ${opts.join(" ")}`)
        };

        const { data, error } = await supabase.from("questions").insert(payload).select();
        if (error) {
          alert("Lỗi lưu lên Supabase: " + error.message);
        } else if (data) {
          setQuestions([data[0], ...questions]);
          alert(`Đã lưu câu hỏi ${cleanCode ? "[" + cleanCode + "] " : ""}thành công!`);
          setNewQ({
            ...newQ,
            question_code: "",
            content: "",
            optA: "", optB: "", optC: "", optD: "",
            correct_answer: "",
            hint1: "",
            hint2: "",
            explanation: ""
          });
        }
      }

      async function handleDeleteQuestion(id) {
        if (!isAdmin || !confirm("Thầy chắc chắn muốn xóa câu hỏi này?")) return;
        await supabase.from("questions").delete().eq("id", id);
        setQuestions(questions.filter((q) => q.id !== id));
      }

      const gradeQuestions = useMemo(
        () => questions.filter((q) => q.grade_id === selectedGrade),
        [questions, selectedGrade]
      );

      const chapters = useMemo(() => {
        const sourceList = searchAllGrades && searchQuery.trim() ? questions : gradeQuestions;
        const set = new Set(sourceList.map((q) => q.chapter));
        return ["ALL", ...Array.from(set)];
      }, [questions, gradeQuestions, searchAllGrades, searchQuery]);

      // =======================================================================
      // BỘ LỌC TÌM KIẾM KẾT HỢP: ƯU TIÊN MÃ CÂU HỎI -> TỪ KHÓA ĐỀ BÀI
      // =======================================================================
      const combinedSearchResults = useMemo(() => {
        const rawTrim = searchQuery.trim();
        const normCodeQuery = normalizeCode(rawTrim);
        const normTextQuery = normalizeText(rawTrim);

        // Nếu đang nhập từ khóa và bật chế độ tìm toàn hệ thống -> tìm cả Khối 9 & 10 để học sinh gõ mã là ra ngay
        const pool = (rawTrim && searchAllGrades) ? questions : gradeQuestions;

        return pool
          .filter((q) => chapterFilter === "ALL" || q.chapter === chapterFilter)
          .map((q) => {
            if (!rawTrim) return { ...q, matchType: "default", priority: 0 };

            const qCode = normalizeCode(q.question_code);

            // 1. Khớp chính xác 100% Mã câu hỏi (VD: gõ "9KL-01" hoặc "9kl-01")
            if (qCode && qCode === normCodeQuery) {
              return { ...q, matchType: "exact_code", priority: 100 };
            }

            // 2. Khớp một phần Mã câu hỏi (VD: gõ "9KL" ra toàn bộ câu có mã bắt đầu bằng 9KL)
            if (qCode && normCodeQuery.length >= 2 && qCode.includes(normCodeQuery)) {
              return { ...q, matchType: "partial_code", priority: 80 };
            }

            // 3. Tìm theo từ khóa nội dung câu hỏi (không dấu + chuẩn hóa H2SO4)
            const tokens = normTextQuery.split(" ").filter((t) => t.length > 0);
            if (tokens.length === 0) return { ...q, matchType: "none", priority: -1 };

            const haystack = normalizeText(
              `${q.question_code || ""} ${q.chapter} ${q.content} ${(q.options || []).join(" ")}`
            );

            let matched = 0;
            tokens.forEach((t) => {
              if (haystack.includes(t)) matched++;
            });

            const ratio = matched / tokens.length;
            if (ratio >= 0.5) {
              return {
                ...q,
                matchType: "keyword",
                matchPercent: Math.round(ratio * 100),
                priority: Math.round(ratio * 60)
              };
            }

            return { ...q, matchType: "none", priority: -1 };
          })
          .filter((q) => q.priority >= 0)
          .sort((a, b) => b.priority - a.priority);
      }, [questions, gradeQuestions, searchQuery, chapterFilter, searchAllGrades]);

      const calculateScore = () => {
        let total = 0;
        gradeQuestions.forEach((q) => {
          const ans = answers[q.id];
          if (!ans) return;
          if (q.type === "true_false" && Array.isArray(q.correct_answer)) {
            let match = 0;
            q.correct_answer.forEach((val, idx) => {
              if (ans[idx] === val) match++;
            });
            const mapScore = [0, 0.1, 0.25, 0.5, 1.0];
            total += mapScore[match] || 0;
          } else if (q.type !== "essay") {
            const normUser = normalizeText(String(ans)).replace(",", ".");
            const normCorr = normalizeText(String(q.correct_answer)).replace(",", ".");
            if (normUser === normCorr) total += 1;
          }
        });
        return total.toFixed(2);
      };

      const formatTime = (sec) => {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${m}:${s < 10 ? "0" : ""}${s}`;
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="bg-teal-800 text-white shadow-md">
            <div className="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="bg-amber-400 text-teal-950 font-extrabold px-3 py-1.5 rounded-lg text-lg">H₂O</div>
                <div>
                  <h1 className="font-bold text-lg leading-tight">HÓA HỌC THẦY CHIẾN</h1>
                  <p className="text-xs text-teal-200">Tra cứu theo Mã câu hỏi & Từ khóa • Luyện tập • Kiểm tra</p>
                </div>
              </div>

              <div className="flex items-center gap-2 flex-wrap">
                {grades.map((g) => (
                  <button
                    key={g.id}
                    onClick={() => { setSelectedGrade(g.id); setChapterFilter("ALL"); setExamSubmitted(false); }}
                    className={`px-3 py-1.5 rounded-lg text-sm font-semibold transition ${
                      selectedGrade === g.id ? "bg-amber-400 text-slate-900" : "bg-teal-700 hover:bg-teal-600"
                    }`}
                  >
                    {g.name}
                  </button>
                ))}

                {user ? (
                  <div className="flex items-center gap-2 ml-2 bg-teal-900 border border-teal-600 px-3 py-1.5 rounded-lg text-sm">
                    <span className="font-semibold">
                      {isAdmin ? "🛡️ GV: " : "🎓 HS: "}
                      {user.full_name}
                      {user.class_name && !isAdmin ? ` (${user.class_name})` : ""}
                    </span>
                    <button onClick={handleLogout} className="text-xs underline text-amber-300 ml-1">Thoát</button>
                  </div>
                ) : (
                  <button
                    onClick={() => { setAuthTab("login"); setAuthModal(true); }}
                    className="ml-2 bg-white text-teal-900 font-bold px-3.5 py-1.5 rounded-lg text-sm hover:bg-teal-50 shadow-sm"
                  >
                    Đăng nhập
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* Thanh điều hướng chế độ */}
          <nav className="bg-white border-b border-slate-200 sticky top-0 z-10">
            <div className="max-w-6xl mx-auto px-4 flex overflow-x-auto gap-2 py-2.5">
              {[
                { id: "lookup", label: "🔍 1. Tra cứu Mã câu & Đề bài" },
                { id: "practice", label: "🎯 2. Luyện tập chuyên đề" },
                { id: "exam", label: "⏱️ 3. Kiểm tra / Thi thử" },
                ...(isAdmin ? [{ id: "admin", label: "🛡️ Quản trị Giáo viên (Admin)" }] : [])
              ].map((tab) => (
                <button
                  key={tab.id}
                  onClick={() => setMode(tab.id)}
                  className={`px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap transition ${
                    mode === tab.id
                      ? tab.id === "admin"
                        ? "bg-amber-600 text-white shadow-sm"
                        : "bg-teal-700 text-white shadow-sm"
                      : "bg-slate-100 text-slate-700 hover:bg-slate-200"
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>
          </nav>

          {/* Nội dung chính */}
          <main className="max-w-5xl w-full mx-auto px-4 py-6 flex-1">
            {/* CHẾ ĐỘ 1: TRA CỨU KẾT HỢP MÃ CÂU HỎI & TỪ KHÓA */}
            {mode === "lookup" && (
              <div className="space-y-4">
                <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-3">
                  <div className="flex flex-wrap justify-between items-center gap-2">
                    <h2 className="font-bold text-lg text-slate-800">
                      Tra cứu hướng dẫn giải & Đáp án
                    </h2>
                    <label className="flex items-center gap-2 text-xs text-slate-600 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={searchAllGrades}
                        onChange={(e) => setSearchAllGrades(e.target.checked)}
                        className="rounded text-teal-600"
                      />
                      Tìm mã câu hỏi trên tất cả các khối lớp
                    </label>
                  </div>

                  <div className="grid sm:grid-cols-3 gap-3">
                    <div className="sm:col-span-2 relative">
                      <input
                        type="text"
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        placeholder="Nhập MÃ CÂU HỎI (VD: 9KL-01, 10NT-01) hoặc gõ từ khóa đề bài..."
                        className="w-full border-2 border-teal-600/40 rounded-lg px-4 py-2.5 focus:outline-none focus:border-teal-600 font-medium"
                      />
                      {searchQuery && (
                        <button
                          onClick={() => setSearchQuery("")}
                          className="absolute right-3 top-3 text-xs text-slate-400 hover:text-slate-700"
                        >
                          Xóa
                        </button>
                      )}
                    </div>
                    <select
                      value={chapterFilter}
                      onChange={(e) => setChapterFilter(e.target.value)}
                      className="border border-slate-300 rounded-lg px-3 py-2.5 text-sm bg-white"
                    >
                      {chapters.map((ch) => (
                        <option key={ch} value={ch}>
                          {ch === "ALL" ? "Tất cả chuyên đề" : ch}
                        </option>
                      ))}
                    </select>
                  </div>

                  {/* Gợi ý bấm nhanh mã mẫu */}
                  <div className="flex flex-wrap items-center gap-2 text-xs text-slate-500 pt-1">
                    <span>Thử tra nhanh theo mã:</span>
                    {["9KL-01", "9HC-02", "9KL-05", "10NT-01"].map((sampleCode) => (
                      <button
                        key={sampleCode}
                        type="button"
                        onClick={() => setSearchQuery(sampleCode)}
                        className="px-2 py-0.5 bg-slate-100 hover:bg-teal-100 text-teal-800 font-mono font-bold rounded border border-slate-300"
                      >
                        {sampleCode}
                      </button>
                    ))}
                  </div>
                </div>

                {combinedSearchResults.length === 0 ? (
                  <div className="bg-white p-8 rounded-xl border border-slate-200 text-center space-y-2">
                    <p className="text-slate-600 font-medium">Không tìm thấy câu hỏi nào khớp với "{searchQuery}".</p>
                    <p className="text-xs text-slate-400">Em hãy kiểm tra lại Mã câu hỏi in ở đầu đề bài (VD: 9KL-01) hoặc nhập 2-3 từ khóa ngắn gọn trong đề nhé.</p>
                  </div>
                ) : (
                  combinedSearchResults.map((q, idx) => (
                    <div
                      key={q.id}
                      className={`bg-white p-5 rounded-xl shadow-sm border space-y-3 ${
                        q.matchType === "exact_code" ? "border-2 border-teal-600 ring-2 ring-teal-100" : "border-slate-200"
                      }`}
                    >
                      <div className="flex flex-wrap justify-between items-center gap-2 text-xs">
                        <div className="flex items-center gap-2 flex-wrap">
                          {q.question_code && (
                            <span className="bg-teal-700 text-white font-mono font-bold px-2.5 py-1 rounded">
                              Mã: {q.question_code}
                            </span>
                          )}
                          <span className="bg-slate-100 text-slate-700 font-semibold px-2.5 py-1 rounded">
                            Khối {q.grade_id} • {q.chapter}
                          </span>
                          {q.matchType === "exact_code" && (
                            <span className="bg-emerald-100 text-emerald-800 font-bold px-2.5 py-1 rounded">
                              ✓ Khớp chính xác Mã câu hỏi
                            </span>
                          )}
                          {q.matchType === "keyword" && (
                            <span className="bg-sky-50 text-sky-700 font-medium px-2 py-0.5 rounded">
                              Khớp {q.matchPercent}% từ khóa
                            </span>
                          )}
                        </div>
                        <span className="text-slate-400">👁️ {q.search_count || 0} lượt xem</span>
                      </div>

                      <p className="font-medium text-slate-900 leading-relaxed">
                        {q.question_code ? `[${q.question_code}] ` : `Câu ${idx + 1}: `}
                        {q.content}
                      </p>

                      {q.options && q.options.length > 0 && (
                        <ul className="grid sm:grid-cols-2 gap-2 text-sm text-slate-700 pl-2">
                          {q.options.map((o, i) => <li key={i}>• {o}</li>)}
                        </ul>
                      )}

                      <div className="flex flex-wrap gap-2 pt-2">
                        <button
                          onClick={() => setRevealedHints({ ...revealedHints, [q.id]: !revealedHints[q.id] })}
                          className="px-3.5 py-1.5 text-sm bg-amber-100 text-amber-900 font-semibold rounded-lg hover:bg-amber-200"
                        >
                          💡 {revealedHints[q.id] ? "Ẩn gợi ý" : "Gợi ý phương pháp giải"}
                        </button>
                        <button
                          onClick={() => setRevealedSol({ ...revealedSol, [q.id]: !revealedSol[q.id] })}
                          className="px-3.5 py-1.5 text-sm bg-teal-100 text-teal-900 font-semibold rounded-lg hover:bg-teal-200"
                        >
                          📖 {revealedSol[q.id] ? "Ẩn đáp án" : "Xem đáp án & lời giải chi tiết"}
                        </button>
                      </div>

                      {revealedHints[q.id] && (
                        <div className="bg-amber-50 border-l-4 border-amber-400 p-3.5 text-sm text-amber-950 space-y-1.5 rounded-r-lg">
                          <p className="font-bold text-amber-800">Hướng dẫn tư duy từng bước:</p>
                          {(q.hints && q.hints.length > 0) ? (
                            q.hints.map((h, i) => <p key={i}>{h}</p>)
                          ) : (
                            <p>Đọc kỹ dữ kiện đề bài, viết phương trình hóa học và tính số mol các chất đã biết.</p>
                          )}
                        </div>
                      )}

                      {revealedSol[q.id] && (
                        <div className="bg-teal-50 border-l-4 border-teal-600 p-3.5 text-sm text-teal-950 space-y-1.5 rounded-r-lg">
                          <p className="font-bold text-teal-900 text-base">
                            Đáp án: {Array.isArray(q.correct_answer) ? q.correct_answer.join(" | ") : q.correct_answer}
                          </p>
                          <p className="leading-relaxed whitespace-pre-line">{q.explanation}</p>
                        </div>
                      )}
                    </div>
                  ))
                )}
              </div>
            )}

            {/* CHẾ ĐỘ 2 & 3: LUYỆN TẬP & KIỂM TRA */}
            {(mode === "practice" || mode === "exam") && (
              <div className="space-y-5">
                <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-3">
                  <div>
                    <h2 className="font-bold text-lg text-slate-800">
                      {mode === "practice" ? "Chế độ Luyện tập (Kiểm tra đáp án từng câu)" : "Bài kiểm tra tổng hợp (Đủ 5 dạng bài tập)"}
                    </h2>
                    <p className="text-sm text-slate-500">Hỗ trợ trắc nghiệm 4 lựa chọn, Đúng/Sai 4 ý, Điền khuyết, Trả lời ngắn và Tự luận.</p>
                  </div>
                  {mode === "exam" && (
                    <div className="flex items-center gap-3">
                      <span className="bg-rose-100 text-rose-700 font-bold px-3 py-1.5 rounded-lg">⏳ {formatTime(timeLeft)}</span>
                      {!examSubmitted && (
                        <button
                          onClick={() => setExamSubmitted(true)}
                          className="bg-teal-700 text-white font-bold px-4 py-2 rounded-lg hover:bg-teal-800"
                        >
                          Nộp bài
                        </button>
                      )}
                    </div>
                  )}
                </div>

                {mode === "exam" && examSubmitted && (
                  <div className="bg-emerald-50 border border-emerald-300 p-5 rounded-xl flex justify-between items-center">
                    <div>
                      <h3 className="font-bold text-emerald-900 text-lg">🎉 Đã nộp bài thành công!</h3>
                      <p className="text-sm text-emerald-800">
                        Điểm phần tự động chấm: <strong className="text-xl">{calculateScore()}</strong> điểm.
                      </p>
                    </div>
                    <button
                      onClick={() => { setExamSubmitted(false); setAnswers({}); setTimeLeft(900); }}
                      className="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-semibold"
                    >
                      Làm lại đề
                    </button>
                  </div>
                )}

                {gradeQuestions.map((q, idx) => (
                  <div key={q.id} className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-3">
                    <div className="flex justify-between text-xs text-slate-500">
                      <div className="flex items-center gap-2">
                        {q.question_code && <span className="font-mono font-bold bg-slate-200 text-slate-800 px-2 py-0.5 rounded">{q.question_code}</span>}
                        <span className="font-semibold text-teal-700">{q.chapter}</span>
                      </div>
                      <span className="uppercase bg-slate-100 px-2 py-0.5 rounded">{q.type}</span>
                    </div>
                    <p className="font-medium text-slate-900">Câu {idx + 1}: {q.content}</p>

                    {q.type === "mcq" && (
                      <div className="grid sm:grid-cols-2 gap-2">
                        {q.options.map((opt, i) => (
                          <label key={i} className={`flex items-center gap-2 p-3 rounded-lg border cursor-pointer ${answers[q.id] === opt ? "border-teal-600 bg-teal-50" : "border-slate-200"}`}>
                            <input
                              type="radio"
                              name={q.id}
                              checked={answers[q.id] === opt}
                              onChange={() => setAnswers({ ...answers, [q.id]: opt })}
                            />
                            <span className="text-sm">{opt}</span>
                          </label>
                        ))}
                      </div>
                    )}

                    {q.type === "true_false" && (
                      <div className="space-y-2">
                        {q.options.map((sub, i) => {
                          const curArr = answers[q.id] || ["", "", "", ""];
                          return (
                            <div key={i} className="flex flex-wrap items-center justify-between gap-2 p-2.5 bg-slate-50 rounded-lg border border-slate-200">
                              <span className="text-sm flex-1">{sub}</span>
                              <div className="flex gap-2">
                                {["Đúng", "Sai"].map((choice) => (
                                  <button
                                    key={choice}
                                    type="button"
                                    onClick={() => {
                                      const next = [...curArr];
                                      next[i] = choice;
                                      setAnswers({ ...answers, [q.id]: next });
                                    }}
                                    className={`px-3 py-1 rounded text-xs font-bold ${
                                      curArr[i] === choice ? "bg-teal-600 text-white" : "bg-white border border-slate-300 text-slate-600"
                                    }`}
                                  >
                                    {choice}
                                  </button>
                                ))}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}

                    {(q.type === "fill_blank" || q.type === "short_answer") && (
                      <input
                        type="text"
                        value={answers[q.id] || ""}
                        onChange={(e) => setAnswers({ ...answers, [q.id]: e.target.value })}
                        placeholder="Nhập câu trả lời ngắn của em..."
                        className="w-full sm:w-80 border border-slate-300 rounded-lg px-3 py-2 text-sm"
                      />
                    )}

                    {q.type === "essay" && (
                      <textarea
                        rows="3"
                        value={answers[q.id] || ""}
                        onChange={(e) => setAnswers({ ...answers, [q.id]: e.target.value })}
                        placeholder="Trình bày lời giải chi tiết hoặc dán link ảnh bài làm..."
                        className="w-full border border-slate-300 rounded-lg p-3 text-sm"
                      />
                    )}

                    {mode === "practice" && (
                      <div className="pt-2">
                        <button
                          onClick={() => setCheckedPractice({ ...checkedPractice, [q.id]: true })}
                          className="bg-teal-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg hover:bg-teal-700"
                        >
                          Kiểm tra câu này
                        </button>
                      </div>
                    )}

                    {((mode === "practice" && checkedPractice[q.id]) || (mode === "exam" && examSubmitted)) && (
                      <div className="bg-slate-100 p-3 rounded-lg text-sm space-y-1 border-l-4 border-teal-600">
                        <p className="font-bold text-teal-800">Đáp án chuẩn: {Array.isArray(q.correct_answer) ? q.correct_answer.join(" | ") : q.correct_answer}</p>
                        <p className="text-slate-700">{q.explanation}</p>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            )}

            {/* CHẾ ĐỘ 4: QUẢN TRỊ ĐỘC QUYỀN CỦA GIÁO VIÊN */}
            {mode === "admin" && isAdmin && (
              <div className="space-y-6">
                {/* Mở rộng khối lớp */}
                <div className="bg-white p-5 rounded-xl shadow-sm border border-amber-200">
                  <h2 className="font-bold text-base text-amber-900 mb-3">1. Quản lý & Mở rộng Khối lớp</h2>
                  <form onSubmit={handleAddGrade} className="flex flex-wrap gap-3">
                    <input
                      required
                      placeholder="Mã khối (VD: 8, 11, ONTHI)"
                      value={newGradeId}
                      onChange={(e) => setNewGradeId(e.target.value)}
                      className="border rounded-lg px-3 py-2 text-sm"
                    />
                    <input
                      required
                      placeholder="Tên hiển thị (VD: Khối 8, Ôn thi vào 10)"
                      value={newGradeName}
                      onChange={(e) => setNewGradeName(e.target.value)}
                      className="border rounded-lg px-3 py-2 text-sm flex-1"
                    />
                    <button type="submit" className="bg-amber-600 text-white font-semibold px-4 py-2 rounded-lg text-sm hover:bg-amber-700">
                      + Thêm khối lớp
                    </button>
                  </form>
                </div>

                {/* Thêm câu hỏi kèm Mã định danh */}
                <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
                  <h2 className="font-bold text-lg text-teal-800">2. Thêm câu hỏi mới & Gắn Mã tra cứu</h2>
                  <form onSubmit={handleAddQuestion} className="space-y-3">
                    <div className="grid sm:grid-cols-4 gap-3">
                      <div>
                        <label className="block text-xs font-bold text-teal-800 mb-1">Mã câu hỏi (In trên phiếu)</label>
                        <input
                          required
                          placeholder="VD: 9KL-06"
                          value={newQ.question_code}
                          onChange={(e) => setNewQ({ ...newQ, question_code: e.target.value })}
                          className="w-full border-2 border-teal-500/40 rounded-lg p-2 text-sm font-mono uppercase"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold mb-1">Khối lớp</label>
                        <select
                          value={newQ.grade_id}
                          onChange={(e) => setNewQ({ ...newQ, grade_id: e.target.value })}
                          className="w-full border rounded-lg p-2 text-sm"
                        >
                          {grades.map((g) => <option key={g.id} value={g.id}>{g.name}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-semibold mb-1">Chương / Chủ đề</label>
                        <input
                          required
                          value={newQ.chapter}
                          onChange={(e) => setNewQ({ ...newQ, chapter: e.target.value })}
                          className="w-full border rounded-lg p-2 text-sm"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold mb-1">Dạng câu hỏi</label>
                        <select
                          value={newQ.type}
                          onChange={(e) => setNewQ({ ...newQ, type: e.target.value })}
                          className="w-full border rounded-lg p-2 text-sm"
                        >
                          <option value="mcq">Trắc nghiệm nhiều lựa chọn</option>
                          <option value="true_false">Trắc nghiệm Đúng/Sai (4 ý)</option>
                          <option value="fill_blank">Điền khuyết</option>
                          <option value="short_answer">Trả lời ngắn</option>
                          <option value="essay">Tự luận</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold mb-1">Nội dung câu hỏi</label>
                      <textarea
                        required
                        rows="2"
                        value={newQ.content}
                        onChange={(e) => setNewQ({ ...newQ, content: e.target.value })}
                        className="w-full border rounded-lg p-2 text-sm"
                        placeholder="Nhập đề bài..."
                      />
                    </div>

                    {(newQ.type === "mcq" || newQ.type === "true_false") && (
                      <div className="grid sm:grid-cols-2 gap-2">
                        <input placeholder="Lựa chọn A / Ý a)" value={newQ.optA} onChange={(e) => setNewQ({ ...newQ, optA: e.target.value })} className="border rounded-lg p-2 text-sm" />
                        <input placeholder="Lựa chọn B / Ý b)" value={newQ.optB} onChange={(e) => setNewQ({ ...newQ, optB: e.target.value })} className="border rounded-lg p-2 text-sm" />
                        <input placeholder="Lựa chọn C / Ý c)" value={newQ.optC} onChange={(e) => setNewQ({ ...newQ, optC: e.target.value })} className="border rounded-lg p-2 text-sm" />
                        <input placeholder="Lựa chọn D / Ý d)" value={newQ.optD} onChange={(e) => setNewQ({ ...newQ, optD: e.target.value })} className="border rounded-lg p-2 text-sm" />
                      </div>
                    )}

                    <div className="grid sm:grid-cols-3 gap-3">
                      <div>
                        <label className="block text-xs font-semibold mb-1">Đáp án chuẩn</label>
                        <input
                          required
                          placeholder="VD: Iron (Fe) hoặc Đúng, Sai, Đúng, Sai"
                          value={newQ.correct_answer}
                          onChange={(e) => setNewQ({ ...newQ, correct_answer: e.target.value })}
                          className="w-full border rounded-lg p-2 text-sm"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold mb-1">Gợi ý bước 1 (Tra cứu)</label>
                        <input
                          placeholder="VD: Tính số mol chất tham gia..."
                          value={newQ.hint1}
                          onChange={(e) => setNewQ({ ...newQ, hint1: e.target.value })}
                          className="w-full border rounded-lg p-2 text-sm"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold mb-1">Gợi ý bước 2 (Tùy chọn)</label>
                        <input
                          placeholder="VD: Áp dụng V = n × 24,79..."
                          value={newQ.hint2}
                          onChange={(e) => setNewQ({ ...newQ, hint2: e.target.value })}
                          className="w-full border rounded-lg p-2 text-sm"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold mb-1">Lời giải chi tiết</label>
                      <textarea
                        rows="2"
                        value={newQ.explanation}
                        onChange={(e) => setNewQ({ ...newQ, explanation: e.target.value })}
                        className="w-full border rounded-lg p-2 text-sm"
                        placeholder="Trình bày lời giải chi tiết để học sinh đối chiếu..."
                      />
                    </div>

                    <button type="submit" className="bg-teal-700 text-white font-bold px-5 py-2.5 rounded-lg hover:bg-teal-800">
                      + Lưu câu hỏi & Mã tra cứu lên hệ thống
                    </button>
                  </form>
                </div>

                {/* Danh sách quản lý & xóa câu hỏi */}
                <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-3">
                  <h2 className="font-bold text-lg text-slate-800">3. Danh sách câu hỏi hiện có ({questions.length} câu)</h2>
                  {questions.map((q) => (
                    <div key={q.id} className="flex justify-between items-start gap-3 p-3 border rounded-lg text-sm">
                      <div>
                        {q.question_code && (
                          <span className="font-mono font-bold bg-teal-100 text-teal-900 px-2 py-0.5 rounded mr-2">
                            {q.question_code}
                          </span>
                        )}
                        <span className="text-xs font-bold text-slate-500">[Khối {q.grade_id} - {q.chapter}] </span>
                        <span>{q.content}</span>
                      </div>
                      <button
                        onClick={() => handleDeleteQuestion(q.id)}
                        className="text-xs text-rose-600 hover:underline font-semibold shrink-0"
                      >
                        Xóa
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* Modal Đăng nhập / Đăng ký phân quyền */}
          {authModal && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-xl max-w-md w-full p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => setAuthTab("login")}
                      className={`text-xs font-bold px-2.5 py-1.5 rounded ${authTab === "login" ? "bg-teal-700 text-white" : "bg-slate-100"}`}
                    >
                      Đăng nhập
                    </button>
                    <button
                      type="button"
                      onClick={() => setAuthTab("register_student")}
                      className={`text-xs font-bold px-2.5 py-1.5 rounded ${authTab === "register_student" ? "bg-teal-700 text-white" : "bg-slate-100"}`}
                    >
                      ĐK Học sinh
                    </button>
                    <button
                      type="button"
                      onClick={() => setAuthTab("register_admin")}
                      className={`text-xs font-bold px-2.5 py-1.5 rounded ${authTab === "register_admin" ? "bg-amber-600 text-white" : "bg-slate-100"}`}
                    >
                      ĐK Giáo viên
                    </button>
                  </div>
                  <button onClick={() => setAuthModal(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>

                <form onSubmit={handleAuth} className="space-y-3">
                  {authTab !== "login" && (
                    <>
                      <input
                        required
                        placeholder={authTab === "register_admin" ? "Họ tên Giáo viên (VD: Thầy Chiến)" : "Họ và tên học sinh"}
                        value={fullName}
                        onChange={(e) => setFullName(e.target.value)}
                        className="w-full border rounded-lg p-2.5 text-sm"
                      />
                      {authTab === "register_student" ? (
                        <div className="grid grid-cols-2 gap-2">
                          <input required placeholder="Lớp (VD: 9D, 10A1)" value={className} onChange={(e) => setClassName(e.target.value)} className="border rounded-lg p-2.5 text-sm" />
                          <input required placeholder="Mã lớp (THAYCHIEN)" value={secretCode} onChange={(e) => setSecretCode(e.target.value)} className="border rounded-lg p-2.5 text-sm" />
                        </div>
                      ) : (
                        <input
                          required
                          type="password"
                          placeholder="Mã bí mật Giáo viên (ADMIN_THAYCHIEN)"
                          value={secretCode}
                          onChange={(e) => setSecretCode(e.target.value)}
                          className="w-full border border-amber-400 rounded-lg p-2.5 text-sm"
                        />
                      )}
                    </>
                  )}
                  <input required type="email" placeholder="Email đăng nhập" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full border rounded-lg p-2.5 text-sm" />
                  <input required type="password" placeholder="Mật khẩu (tối thiểu 6 ký tự)" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full border rounded-lg p-2.5 text-sm" />
                  <button
                    type="submit"
                    className={`w-full text-white font-bold py-2.5 rounded-lg ${authTab === "register_admin" ? "bg-amber-600 hover:bg-amber-700" : "bg-teal-700 hover:bg-teal-800"}`}
                  >
                    {authTab === "login" ? "Đăng nhập hệ thống" : authTab === "register_admin" ? "Tạo tài khoản Quản trị" : "Tạo tài khoản Học sinh"}
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
